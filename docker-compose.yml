services:
  postgres:
    image: postgres:16-alpine
    container_name: webshop_gamefi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: webshop
      POSTGRES_PASSWORD: webshop
      POSTGRES_DB: webshop_gamefi
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webshop -d webshop_gamefi']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: webshop_gamefi_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Optional admin UI — start with `docker compose --profile tools up -d`
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: webshop_gamefi_pgadmin
    profiles: ['tools']
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@webshop-gamefi.local
      PGADMIN_DEFAULT_PASSWORD: webshop
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '8081:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
